
name: Deploy Three-Tier Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |
           echo "Starting deployment..."

            echo "Frontend deployment completed successfully."
            
            cd /home/ubuntu/Three-tier-frontend

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm install

            echo "Building React application..."
            npm run build


            echo "Deploying frontend..."
            sudo rm -rf /var/www/html/Three-tier-frontend/*
            sudo cp -r /home/ubuntu/Three-tier-frontend/dist/* /var/www/html/Three-tier-frontend/

            echo "Setting permissions..."
            sudo chown -R www-data:www-data /var/www/html/Three-tier-frontend
            sudo chmod -R 755 /var/www/html/Three-tier-frontend


            echo "Frontend deployment completed successfully."

